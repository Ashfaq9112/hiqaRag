[project]
name = "hiqarag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-text-splitters>=1.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: parses real PDFs from data/ (deselect with -m 'not slow')"]
